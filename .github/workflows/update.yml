name: 每日更新資料並部署

on:
  schedule:
    - cron: "17 1,7,13,19 * * *"   # 每天 4 次（UTC 01:17/07:17/13:17/19:17 = 台北 09:17/15:17/21:17/03:17），避開整點；GitHub 排程常延遲或跳過，多排幾次提高成功率。資料為增量累積，重複執行無害
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    # 只有排程與手動觸發才抓資料；推送 site/ 時只重新部署
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 各來源獨立執行，單一來源失敗不影響其他來源；失敗會寫進 data/status.json
      - name: 國防部每日動態
        continue-on-error: true
        run: python scripts/fetch_mnd.py
      - name: 加權指數與新台幣匯率
        continue-on-error: true
        run: python scripts/fetch_market.py
      - name: 新聞熱度與標題
        continue-on-error: true
        run: python scripts/fetch_news.py
      - name: 整合資料
        run: python scripts/build_site_data.py
      - name: 提交資料變更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "沒有資料變動"
          else
            git commit -m "資料更新 $(TZ=Asia/Taipei date +%F)"
            git push
          fi

  deploy:
    needs: [update]
    # update 被略過（push 觸發）或失敗以外都要部署
    if: ${{ !cancelled() && (needs.update.result == 'success' || needs.update.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
